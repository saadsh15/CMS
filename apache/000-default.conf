<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Mount Drupal at /cms in addition to / so Traefik can route saadshafique.com/cms
    # with stripPath=false and Drupal automatically prefixes assets/forms with /cms.
    Alias /cms /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirect bare /cms to /cms/user/login (or /cms/) cleanly
    RedirectMatch 302 ^/cms/?$ /cms/user/login

    <Location /cms>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /cms/index.php [L]
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
